<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOARDPASS - Offline</title>
  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background-color: #161b22;
      border-radius: 8px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px 0;
    }
    p {
      color: #8b949e;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    button {
      background-color: #58a6ff;
      color: #0d1117;
      border: none;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are currently offline</h1>
    <p>BOARDPASS is running in offline mode. Your downloaded scenarios, ward tips, and progress are cached.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
